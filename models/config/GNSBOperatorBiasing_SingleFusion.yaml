nc: 1
depth_multiple: 1.00
width_multiple: 1.00

anchors:
  - [10,13, 16,30, 33,23]
  - [30,61, 62,45, 59,119]
  - [116,90, 156,198, 373,326]

backbone:
  # RGB backbone
  - [-1, 1, Focus,    [64, 3]]           # 0: 64×320×320
  - [-1, 1, Conv,     [128, 3, 2]]       # 1: 128×160×160
  - [-1, 3, C3,       [128]]             # 2: 128×160×160
  - [-1, 1, Conv,     [256, 3, 2]]       # 3: 256×80×80
  - [-1, 3, C3,       [256]]             # 4: 256×80×80
  - [-1, 1, Conv,     [512, 3, 2]]       # 5: 512×40×40
  - [-1, 9, C3,       [512]]             # 6: 512×40×40
  - [-1, 1, Conv,     [1024, 3, 2]]      # 7:1024×20×20
  - [-1, 1, SPP,      [1024, [5,9,13]]]  # 8:1024×20×20
  - [-1, 3, C3,       [1024]]            # 9:1024×20×20 (RGB P5)

  # NIR backbone
  - [-4, 1, Focus,    [64, 3]]           #10: 64×320×320 (raw NIR input)
  - [-1, 1, Conv,     [128, 3, 2]]       #11:128×160×160
  - [-1, 3, C3,       [128]]             #12:128×160×160
  - [-1, 1, Conv,     [256, 3, 2]]       #13:256×80×80
  - [-1, 3, C3,       [256]]             #14:256×80×80
  - [-1, 1, Conv,     [512, 3, 2]]       #15:512×40×40
  - [-1, 9, C3,       [512]]             #16:512×40×40
  - [-1, 1, Conv,     [1024, 3, 2]]      #17:1024×20×20
  - [-1, 1, SPP,      [1024, [5,9,13]]]  #18:1024×20×20
  - [-1, 3, C3,       [1024]]            #19:1024×20×20 (NIR P5)

  # P5 feature extraction
  - [9,  1, C3TR,     [1024]]            #20: RGB P5 上做 Transformer → 1024×20×20
  - [19, 1, C3TR,     [1024]]            #21: NIR P5 上做 Transformer → 1024×20×20

  # GNSB fusion
  - [[20,21], 1, GNSBOperatorFusion,
      [{
        K: 64,
        token_dim: 256,
        graph_topk: 10,
        gno_hidden: 384,
        cfm_steps: 4,
        cfm_enable: true,
        cfm_loss_weight: 0.1,
        bridge_mode: "cfm",
        pos_bias_alpha: 0.3,
        ref_mix_lambda_init: 0.5,
        subgraph_layers: 2,
        subgraph_dropout: 0.1,
      }]
    ]

  - [[9, 22],  1, Add2,    [1024, 0]]     #23: RGB 残差回流（取 GNSB 第 0 路）→ 1024×20×20
  - [[19, 22], 1, Add2,    [1024, 1]]     #24: NIR 残差回流（取 GNSB 第 1 路）→ 1024×20×20
  - [[23, 24], 1, Add,     [1]]           #25: 最终融合一路 → 1024×20×20 (P5)

head:
  # FPN
  - [-1, 1, Conv,        [512, 1, 1]]        #26:512×20×20
  - [-1, 1, nn.Upsample, [None,2,'nearest']] #27:512×40×40
  - [-1, 3, C3,          [512, False]]       #28:512×40×40 (P4)

  - [-1, 1, Conv,        [256, 1, 1]]        #29:256×40×40
  - [-1, 1, nn.Upsample, [None,2,'nearest']] #30:256×80×80
  - [-1, 3, C3,          [256, False]]       #31:256×80×80 (P3)

  # PAN
  - [-1, 1, Conv,  [256, 3, 2]]              #32:256×40×40
  - [[32,28],1, Concat, [1]]                 #33:768×40×40
  - [-1, 3, C3,  [512, False]]               #34:512×40×40 (refined P4)

  - [-1, 1, Conv,  [512, 3, 2]]              #35:512×20×20
  - [[35,25],1, Concat, [1]]                 #36:1536×20×20
  - [-1, 3, C3,  [1024, False]]              #37:1024×20×20 (refined P5)

  # Detection
  - [[31, 34, 37], 1, Detect, [nc, anchors]] # Detect(P3, P4, P5)
